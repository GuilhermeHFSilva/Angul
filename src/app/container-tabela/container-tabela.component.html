<div class="painel-container">
  <header class="cabecalho">
    <h2>{{ titulo }}</h2>
    <p class="subtitulo">{{ fazenda }}</p>
  </header>

  <div class="tabela-wrapper">
    <table class="tabela-sensores">
      <thead>
        <tr>
          <th>#</th>
          <th>Data / Hora</th>
          <th>N (mg/kg)</th>
          <th>P (mg/kg)</th>
          <th>K (mg/kg)</th>
          <th>Umidade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of leituras; let i = index">
          <td class="col-indice">{{ i + 1 }}</td>
          <td>{{ s.data }}</td>
          <td>{{ s.n }}</td>
          <td>{{ s.p }}</td>
          <td>{{ s.k }}</td>
          <td>{{ s.umidade | percent: '1.0-0' }}</td>
          <td>
            <span class="badge" [ngClass]="getStatusClass(s.status)">
              {{ s.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
